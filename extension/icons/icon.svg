<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="56" y1="32" x2="72" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- Chain link left -->
  <path d="M38 56 A14 14 0 0 1 52 42 L58 42 A14 14 0 0 1 58 70 L52 70 A14 14 0 0 1 38 56Z"
        stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- Chain link right -->
  <path d="M70 56 A14 14 0 0 1 84 42 L90 42 A14 14 0 0 1 90 70 L84 70 A14 14 0 0 1 70 56Z"
        stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"
        transform="rotate(180 80 56)"/>
  <!-- Connecting bar -->
  <line x1="52" y1="56" x2="76" y2="56" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- Lightning bolt -->
  <path d="M68 32 L56 60 L66 60 L58 96 L78 54 L66 54 L76 32 Z" fill="url(#bolt)"/>
</svg>
